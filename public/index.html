<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skyrox Plus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080d18;
    --surface: #111a2a;
    --line: #21314d;
    --text: #edf4ff;
    --text-dim: #7f91ad;
    --accent: #3b82f6;
    --accent-dim: rgba(59, 130, 246, 0.16);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 42px 42px;
    background-position: center;
    color: var(--text);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .wrap { width: 100%; max-width: 460px; }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.22em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .eyebrow::before {
    content: "";
    width: 6px;
    height: 6px;
    background: var(--accent);
    display: inline-block;
    border-radius: 1px;
  }
  h1 { font-size: 1.9rem; line-height: 1.4; font-weight: 700; margin: 0 0 8px; letter-spacing: -0.01em; }
  p.desc { color: var(--text-dim); font-size: 0.92rem; line-height: 1.7; margin: 0 0 36px; }
  .route { display: flex; align-items: center; margin-bottom: 36px; }
  .node { display: flex; flex-direction: column; align-items: center; gap: 8px; flex-shrink: 0; }
  .node-dot { width: 9px; height: 9px; border: 1.5px solid var(--text-dim); border-radius: 50%; background: var(--bg); }
  .node.mid .node-dot { border-color: var(--accent); background: var(--accent); box-shadow: 0 0 0 4px var(--accent-dim); }
  .node-label { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.14em; color: var(--text-dim); }
  .node.mid .node-label { color: var(--accent); }
  .track {
    flex: 1;
    height: 1px;
    position: relative;
    background-image: repeating-linear-gradient(90deg, var(--line) 0 4px, transparent 4px 8px);
    margin: 0 6px;
    top: -8px;
  }
  .track .pulse {
    position: absolute;
    top: 50%;
    left: 0;
    width: 4px;
    height: 4px;
    background: var(--accent);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    animation: travel 2.6s ease-in-out infinite;
    box-shadow: 0 0 6px var(--accent);
  }
  .track.b .pulse { animation-delay: 1.3s; }
  @keyframes travel {
    0% { left: 0%; opacity: 0; }
    12% { opacity: 1; }
    88% { opacity: 1; }
    100% { left: 100%; opacity: 0; }
  }
  form {
    display: flex;
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 3px;
    overflow: hidden;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  form:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
  .prompt {
    display: flex;
    align-items: center;
    padding: 0 4px 0 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.95rem;
    color: var(--accent);
    user-select: none;
  }
  input {
    flex: 1;
    padding: 15px 6px;
    border: none;
    background: transparent;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.9rem;
    min-width: 0;
  }
  input::placeholder { color: #4c5c75; }
  input:focus { outline: none; }
  button {
    padding: 0 22px;
    border: none;
    border-left: 1px solid var(--line);
    background: var(--surface);
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.95rem;
    cursor: pointer;
    transition: color 0.15s ease, background 0.15s ease;
  }
  button:hover { color: #fff; background: var(--accent); }
  .favorites-bar {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-top: 10px;
    min-height: 32px;
  }
  .add-favorite,
  .favorite-link {
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    width: 32px;
    height: 32px;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: rgba(17, 26, 42, 0.82);
    color: var(--text-dim);
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }
  .add-favorite {
    color: var(--accent);
    font: 400 20px/1 sans-serif;
  }
  .add-favorite:hover,
  .favorite-link:hover {
    color: #fff;
    border-color: var(--accent);
    background: var(--accent);
  }
  .favorites {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .favorites::-webkit-scrollbar { display: none; }
  .favorite { flex: 0 0 auto; }
  .favorite-link img {
    width: 17px;
    height: 17px;
    border-radius: 3px;
    object-fit: contain;
  }
  .note { margin-top: 18px; font-size: 11.5px; line-height: 1.7; color: #52627b; }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none !important; } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">route relay</div>
    <h1>Skyrox Plus</h1>
    <p class="desc">URLまたは検索したいキーワードを入力してください。</p>
    <div class="route">
      <div class="node"><span class="node-dot"></span><span class="node-label">YOU</span></div>
      <div class="track a"><span class="pulse"></span></div>
      <div class="node mid"><span class="node-dot"></span><span class="node-label">RELAY</span></div>
      <div class="track b"><span class="pulse"></span></div>
      <div class="node"><span class="node-dot"></span><span class="node-label">SITE</span></div>
    </div>
    <form onsubmit="go(event)">
      <span class="prompt">›</span>
      <input type="text" id="url" placeholder="URL または検索キーワード" autocomplete="off" autofocus>
      <button type="submit">開く</button>
    </form>
    <div class="favorites-bar">
      <button class="add-favorite" type="button" onclick="addFavorite()" title="お気に入りに追加" aria-label="お気に入りに追加">＋</button>
      <div class="favorites" id="favorites" aria-label="お気に入り"></div>
    </div>
    <p class="note">URL以外はDuckDuckGoで検索します。お気に入りは右クリックで削除できます。</p>
  </div>
  <script>
    function isUrl(input) {
      // http(s)付きURL、ドメイン、localhost、IPv4をURLとして扱う
      if (/^https?:\/\//i.test(input)) return true;
      if (/^localhost(?::\d+)?(?:[/?#].*)?$/i.test(input)) return true;
      if (/^(?:\d{1,3}\.){3}\d{1,3}(?::\d+)?(?:[/?#].*)?$/.test(input)) return true;
      return /^(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,}(?::\d+)?(?:[/?#].*)?$/i.test(input);
    }

    const FAVORITES_KEY = 'skyrox-plus-favorites';

    function getDestination(input) {
      if (isUrl(input)) {
        return /^https?:\/\//i.test(input) ? input : 'https://' + input;
      }
      return 'https://duckduckgo.com/?q=' + encodeURIComponent(input);
    }

    function openDestination(destination) {
      window.location.href = '/proxy/' + destination;
    }

    function go(e) {
      e.preventDefault();
      const input = document.getElementById('url').value.trim();
      if (!input) return;
      openDestination(getDestination(input));
    }

    function loadFavorites() {
      try {
        const saved = JSON.parse(localStorage.getItem(FAVORITES_KEY) || '[]');
        return Array.isArray(saved) ? saved : [];
      } catch {
        return [];
      }
    }

    function saveFavorites(favorites) {
      localStorage.setItem(FAVORITES_KEY, JSON.stringify(favorites));
      renderFavorites();
    }

    function faviconFor(destination) {
      try {
        const url = new URL(destination);
        return url.origin + '/favicon.ico';
      } catch {
        return 'https://duckduckgo.com/favicon.ico';
      }
    }

    function labelFor(input, destination) {
      if (!isUrl(input)) return input;
      try {
        return new URL(destination).hostname.replace(/^www\./, '');
      } catch {
        return input;
      }
    }

    function addFavorite() {
      const field = document.getElementById('url');
      const input = field.value.trim();
      if (!input) {
        field.focus();
        return;
      }

      const destination = getDestination(input);
      const favorites = loadFavorites();
      if (favorites.some(item => item.destination === destination)) return;

      favorites.push({
        id: Date.now().toString(36),
        label: labelFor(input, destination),
        destination,
        favicon: faviconFor(destination)
      });
      saveFavorites(favorites);
    }

    function removeFavorite(id, event) {
      event.stopPropagation();
      saveFavorites(loadFavorites().filter(item => item.id !== id));
    }

    function renderFavorites() {
      const container = document.getElementById('favorites');
      container.replaceChildren();

      loadFavorites().forEach(item => {
        const wrapper = document.createElement('div');
        wrapper.className = 'favorite';

        const link = document.createElement('button');
        link.type = 'button';
        link.className = 'favorite-link';
        link.title = item.label;
        link.addEventListener('click', () => openDestination(item.destination));

        const icon = document.createElement('img');
        icon.src = item.favicon;
        icon.alt = '';
        icon.loading = 'lazy';
        icon.addEventListener('error', () => {
          icon.src = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#21314d"/><circle cx="12" cy="12" r="5" fill="#3b82f6"/></svg>');
        }, { once: true });

        link.setAttribute('aria-label', item.label);
        link.addEventListener('contextmenu', event => {
          event.preventDefault();
          removeFavorite(item.id, event);
        });

        link.append(icon);
        wrapper.append(link);
        container.append(wrapper);
      });
    }

    renderFavorites();
  </script>
</body>
</html>
